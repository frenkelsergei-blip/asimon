<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap">
  <style>
    body{margin:0;background:#FFFCF6}
    a{color:#2C6BFF}a:hover{color:#1B4FD1}
  </style>
</helmet>

<div dir="rtl" style="width:390px;height:844px;background:#FFFCF6;font-family:'Assistant',system-ui,sans-serif;color:#17161C;display:flex;flex-direction:column;gap:18px;padding:22px 16px 26px;box-sizing:border-box;background-image:linear-gradient(180deg,rgba(44,107,255,.12),rgba(255,252,246,0));background-repeat:no-repeat;background-size:100% 300px;">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6B6A78;">חדר NF2S</span>
    <span style="font-size:12.5px;font-weight:700;color:#46445A;background:#FFFFFF;border:1px solid #E7E4F0;border-radius:99px;padding:6px 13px;">3 בפנים</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:5px;">
    <div style="font-family:'Suez One',Georgia,serif;font-size:34px;line-height:1.05;">בחרו פרצוף</div>
    <div style="font-size:14.5px;color:#6B6A78;">זה מה שכולם יראו לידכם כל המשחק.</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;">

    <div style="aspect-ratio:1;border-radius:18px;background:#FFFFFF;border:2px solid #E7E4F0;display:grid;place-items:center;">
      <svg viewBox="0 0 40 40" width="46" height="46" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#FF7A45"/><path d="M7 12 11 3 16.5 9.5Z" fill="#E05528"/><path d="M33 12 29 3 23.5 9.5Z" fill="#E05528"/><ellipse cx="20" cy="26.5" rx="10" ry="7.5" fill="#FFF1E8"/><circle cx="14.8" cy="19" r="2.1" fill="#3A2318"/><circle cx="25.2" cy="19" r="2.1" fill="#3A2318"/><circle cx="20" cy="25" r="2.3" fill="#3A2318"/></svg>
    </div>

    <div style="aspect-ratio:1;border-radius:18px;background:#FFFFFF;border:2px solid #E7E4F0;display:grid;place-items:center;">
      <svg viewBox="0 0 40 40" width="46" height="46" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#7A5AF8"/><path d="M8.5 11 13 4 17.5 10.5Z" fill="#5E3FDB"/><path d="M31.5 11 27 4 22.5 10.5Z" fill="#5E3FDB"/><circle cx="14.4" cy="20" r="6.4" fill="#F3EFFF"/><circle cx="25.6" cy="20" r="6.4" fill="#F3EFFF"/><circle cx="14.4" cy="20" r="2.6" fill="#2A2140"/><circle cx="25.6" cy="20" r="2.6" fill="#2A2140"/><path d="M20 25.5 17.4 29.5h5.2Z" fill="#FFB020"/></svg>
    </div>

    <div style="aspect-ratio:1;border-radius:18px;background:#FFFFFF;border:2px solid #E7E4F0;display:grid;place-items:center;">
      <svg viewBox="0 0 40 40" width="46" height="46" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#2C6BFF"/><path d="M8 13 10.5 4 17 10Z" fill="#1B4FD1"/><path d="M32 13 29.5 4 23 10Z" fill="#1B4FD1"/><circle cx="14.6" cy="20" r="2.3" fill="#0E1E3F"/><circle cx="25.4" cy="20" r="2.3" fill="#0E1E3F"/><path d="M20 25 18.4 27h3.2Z" fill="#0E1E3F"/><path d="M6.5 22h5M6.5 25.5h5M33.5 22h-5M33.5 25.5h-5" stroke="#BBD2FF" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>

    <div style="aspect-ratio:1;border-radius:18px;background:#FFFFFF;border:2px solid #E7E4F0;display:grid;place-items:center;">
      <svg viewBox="0 0 40 40" width="46" height="46" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#8A5A3B"/><circle cx="9.5" cy="10" r="5.6" fill="#6F452B"/><circle cx="30.5" cy="10" r="5.6" fill="#6F452B"/><ellipse cx="20" cy="26" rx="9.2" ry="7" fill="#F6E4D2"/><circle cx="15" cy="19.5" r="2.1" fill="#3A2318"/><circle cx="25" cy="19.5" r="2.1" fill="#3A2318"/><ellipse cx="20" cy="24.5" rx="3" ry="2.2" fill="#3A2318"/></svg>
    </div>

    <div style="aspect-ratio:1;border-radius:18px;background:#EAF0FF;border:2px solid #2C6BFF;display:grid;place-items:center;position:relative;box-shadow:0 0 0 3px rgba(44,107,255,.16);">
      <span style="position:absolute;top:-7px;inset-inline-end:-7px;width:22px;height:22px;border-radius:50%;background:#2C6BFF;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>
      <svg viewBox="0 0 40 40" width="46" height="46" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#12B886"/><circle cx="12.5" cy="11" r="6.2" fill="#0D8F69"/><circle cx="27.5" cy="11" r="6.2" fill="#0D8F69"/><circle cx="12.5" cy="11" r="3.6" fill="#FFFFFF"/><circle cx="27.5" cy="11" r="3.6" fill="#FFFFFF"/><circle cx="12.5" cy="11.4" r="1.8" fill="#08322A"/><circle cx="27.5" cy="11.4" r="1.8" fill="#08322A"/><path d="M11 25q9 7 18 0" stroke="#08322A" stroke-width="2.1" fill="none" stroke-linecap="round"/></svg>
    </div>

    <div style="aspect-ratio:1;border-radius:18px;background:#FFFFFF;border:2px solid #E7E4F0;display:grid;place-items:center;">
      <svg viewBox="0 0 40 40" width="46" height="46" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#0891B2"/><ellipse cx="21" cy="25" rx="13" ry="8.5" fill="#076A85"/><path d="M8.5 25q-4.5-3-6 1.5 4 2.5 6-1.5Z" fill="#076A85"/><path d="M22 10v5M17.5 12v3.5M26.5 12v3.5" stroke="#CFF3FB" stroke-width="2.1" stroke-linecap="round"/><circle cx="27" cy="23.5" r="2" fill="#04303D"/><path d="M12 28.5q5 2.5 10 0" stroke="#CFF3FB" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    </div>

    <div style="aspect-ratio:1;border-radius:18px;background:#FFFFFF;border:2px solid #E7E4F0;display:grid;place-items:center;">
      <svg viewBox="0 0 40 40" width="46" height="46" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#FFB020"/><path d="M2.6 14.5h34.8v5H2.6zM4.6 25h30.8v5H4.6z" fill="#3A2A05"/><circle cx="14.5" cy="11.5" r="2" fill="#3A2A05"/><circle cx="25.5" cy="11.5" r="2" fill="#3A2A05"/><path d="M11 6.5 6 2.5M29 6.5 34 2.5" stroke="#3A2A05" stroke-width="1.6" stroke-linecap="round"/><circle cx="5.6" cy="1.8" r="1.8" fill="#3A2A05"/><circle cx="34.4" cy="1.8" r="1.8" fill="#3A2A05"/></svg>
    </div>

    <div style="aspect-ratio:1;border-radius:18px;background:#FFFFFF;border:2px solid #E7E4F0;display:grid;place-items:center;">
      <svg viewBox="0 0 40 40" width="46" height="46" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#F5F2EC"/><circle cx="9" cy="9.5" r="5.8" fill="#20202A"/><circle cx="31" cy="9.5" r="5.8" fill="#20202A"/><ellipse cx="13.8" cy="20" rx="5.2" ry="6" fill="#20202A" transform="rotate(-14 13.8 20)"/><ellipse cx="26.2" cy="20" rx="5.2" ry="6" fill="#20202A" transform="rotate(14 26.2 20)"/><circle cx="14.4" cy="20" r="1.9" fill="#FFFFFF"/><circle cx="25.6" cy="20" r="1.9" fill="#FFFFFF"/><ellipse cx="20" cy="27" rx="3" ry="2.2" fill="#20202A"/></svg>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:9px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6B6A78;display:flex;align-items:center;gap:10px;">איך קוראים לכם?<span style="flex:1;height:1px;background:#E7E4F0;"></span></span>
    <div style="display:flex;align-items:center;gap:11px;background:#FFFFFF;border:1px solid #E7E4F0;border-radius:13px;padding:10px 14px;">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#12B886"/><circle cx="12.5" cy="11" r="6.2" fill="#0D8F69"/><circle cx="27.5" cy="11" r="6.2" fill="#0D8F69"/><circle cx="12.5" cy="11" r="3.6" fill="#FFFFFF"/><circle cx="27.5" cy="11" r="3.6" fill="#FFFFFF"/><circle cx="12.5" cy="11.4" r="1.8" fill="#08322A"/><circle cx="27.5" cy="11.4" r="1.8" fill="#08322A"/><path d="M11 25q9 7 18 0" stroke="#08322A" stroke-width="2.1" fill="none" stroke-linecap="round"/></svg>
      <span style="font-size:17px;font-weight:700;">סבתא</span>
    </div>
  </div>

  <div style="flex:1;"></div>

  <button style="font-family:'Assistant',sans-serif;font-size:16px;font-weight:800;border:0;border-radius:13px;background:#2C6BFF;color:#FFFFFF;padding:16px;width:100%;box-shadow:0 1px 2px rgba(23,22,28,.05),0 8px 24px -14px rgba(23,22,28,.35);">להצטרף למשחק</button>
</div>
</x-dc>
</body>
</html>
