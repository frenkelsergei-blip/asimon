<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap">
  <style>
    body{margin:0;background:#FFFCF6}
    a{color:#2C6BFF}a:hover{color:#1B4FD1}
  </style>
</helmet>

<div dir="rtl" style="width:390px;height:844px;background:#FFFCF6;font-family:'Assistant',system-ui,sans-serif;color:#17161C;display:flex;flex-direction:column;gap:16px;padding:22px 16px 26px;box-sizing:border-box;overflow:hidden;background-image:linear-gradient(180deg,rgba(18,184,134,.12),rgba(255,252,246,0));background-repeat:no-repeat;background-size:100% 300px;">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6B6A78;">אחרי שמונה סבבים</span>
    <span style="font-size:12.5px;font-weight:700;color:#46445A;background:#FFFFFF;border:1px solid #E7E4F0;border-radius:99px;padding:6px 13px;">9 שחקנים</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:5px;">
    <div style="font-family:'Suez One',Georgia,serif;font-size:34px;line-height:1.05;">התמנונים הגיעו לסוף</div>
    <div style="font-size:14.5px;color:#6B6A78;line-height:1.45;">הקבוצה זזה על הלוח. מתחת לה, המשחק ספר כל אחד בנפרד.</div>
  </div>

  <div style="background:#FFFFFF;border:1px solid #E7E4F0;border-radius:16px;padding:6px 16px;display:flex;flex-direction:column;">

    <div style="padding:14px 0 12px;border-bottom:1px solid #F1EFF9;display:flex;flex-direction:column;gap:9px;">
      <div style="display:grid;grid-template-columns:34px 1fr auto;align-items:center;column-gap:12px;">
        <span style="width:34px;height:34px;border-radius:50%;background:#12B886;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;direction:ltr;">TM</span>
        <span style="font-size:16px;font-weight:800;">התמנונים</span>
        <span style="font-size:26px;font-weight:800;color:#0D8F69;direction:ltr;font-variant-numeric:tabular-nums;">24</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;padding-inline-start:46px;">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:700;color:#46445A;">רון</span><span style="color:#6B6A78;direction:ltr;font-variant-numeric:tabular-nums;">11</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:700;color:#46445A;">שירה</span><span style="color:#6B6A78;direction:ltr;font-variant-numeric:tabular-nums;">9</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:700;color:#46445A;">אבי</span><span style="color:#6B6A78;direction:ltr;font-variant-numeric:tabular-nums;">4</span></div>
      </div>
    </div>

    <div style="padding:14px 0 12px;border-bottom:1px solid #F1EFF9;display:flex;flex-direction:column;gap:9px;">
      <div style="display:grid;grid-template-columns:34px 1fr auto;align-items:center;column-gap:12px;">
        <span style="width:34px;height:34px;border-radius:50%;background:#2C6BFF;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;direction:ltr;">TZ</span>
        <span style="font-size:16px;font-weight:800;">הצפרדעים</span>
        <span style="font-size:26px;font-weight:800;color:#46445A;direction:ltr;font-variant-numeric:tabular-nums;">21</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;padding-inline-start:46px;">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:700;color:#46445A;">דנה</span><span style="color:#6B6A78;direction:ltr;font-variant-numeric:tabular-nums;">12</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:700;color:#46445A;">יואב</span><span style="color:#6B6A78;direction:ltr;font-variant-numeric:tabular-nums;">7</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:700;color:#46445A;">מיכל</span><span style="color:#6B6A78;direction:ltr;font-variant-numeric:tabular-nums;">2</span></div>
      </div>
    </div>

    <div style="padding:14px 0 13px;display:flex;flex-direction:column;gap:9px;">
      <div style="display:grid;grid-template-columns:34px 1fr auto;align-items:center;column-gap:12px;">
        <span style="width:34px;height:34px;border-radius:50%;background:#FF5A3D;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;direction:ltr;">NM</span>
        <span style="font-size:16px;font-weight:800;">הנמלים</span>
        <span style="font-size:26px;font-weight:800;color:#46445A;direction:ltr;font-variant-numeric:tabular-nums;">18</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;padding-inline-start:46px;">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:700;color:#46445A;">תמר</span><span style="color:#6B6A78;direction:ltr;font-variant-numeric:tabular-nums;">8</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:700;color:#46445A;">עומר</span><span style="color:#6B6A78;direction:ltr;font-variant-numeric:tabular-nums;">7</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:700;color:#46445A;">נועה</span><span style="color:#6B6A78;direction:ltr;font-variant-numeric:tabular-nums;">3</span></div>
      </div>
    </div>

  </div>

  <div style="flex:1;"></div>

  <div style="display:flex;flex-direction:column;">
    <div style="position:relative;background:#12B886;color:#fff;border-radius:18px 18px 4px 4px;padding:20px 22px;overflow:clip;">
      <div style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72);">הרמז שנחת הכי מאוחר</div>
      <div style="font-family:'Suez One',Georgia,serif;font-weight:400;font-size:34px;line-height:1.06;margin-top:8px;">דנה, בשנייה ה&#8209;<span style="direction:ltr;display:inline-block;">86</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:13px;border-top:1px dashed rgba(255,255,255,.38);">
        <span style="font-size:15px;font-weight:800;">&laquo;אסימון&raquo;</span>
        <span style="font-size:15px;font-weight:800;background:rgba(255,255,255,.18);padding:5px 11px;border-radius:8px;direction:ltr;">+6</span>
      </div>
    </div>
    <div style="height:9px;background:radial-gradient(circle at 5px 0,transparent 3.6px,#12B886 4.1px) 0 0/10px 10px repeat-x;"></div>
  </div>

</div>
</x-dc>
</body>
</html>
