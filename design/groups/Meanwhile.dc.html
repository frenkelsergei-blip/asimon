<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>

    a{color:#2C6BFF}a:hover{color:#1B4FD1}

</helmet>

<div dir="rtl" style="width:390px;height:844px;background:#FFFCF6;font-family:'Assistant',system-ui,sans-serif;color:#17161C;display:flex;flex-direction:column;gap:16px;padding:22px 16px 26px;box-sizing:border-box;overflow:hidden;background-image:linear-gradient(180deg,rgba(44,107,255,.12),rgba(255,252,246,0));background-repeat:no-repeat;background-size:100% 300px;">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6B6A78;">סבב 4</span>
    <span style="font-size:12.5px;font-weight:700;color:#46445A;background:#FFFFFF;border:1px solid #E7E4F0;border-radius:99px;padding:6px 13px;">אתם מנחשים</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:5px;">
    <div style="font-family:'Suez One',Georgia,serif;font-size:32px;line-height:1.05;">הצפרדעים מתייעצים</div>
    <div style="font-size:14.5px;color:#6B6A78;line-height:1.45;">יש להם 45 שניות להחליט. המילה והמטרה יישארו סוד &mdash; אבל את מי הם שולחים תדעו עכשיו.</div>
  </div>

  <div style="background:#FFFFFF;border:1px solid #E7E4F0;border-radius:16px;padding:14px 16px 13px;display:flex;align-items:center;gap:14px;">

    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;">
      <span style="font-size:12.5px;font-weight:700;color:#6B6A78;">ההתייעצות שלהם</span>
      <span style="height:8px;border-radius:99px;background:#F4F2FA;overflow:hidden;display:block;">
        <span style="display:block;height:100%;width:84%;border-radius:99px;background:linear-gradient(90deg,#2C6BFF,#7A5AF8);"></span>
      </span>
    </span>
  </div>

  <div style="display:flex;flex-direction:column;">
    <div style="position:relative;background:#17161C;color:#fff;border-radius:18px 18px 4px 4px;padding:22px;overflow:clip;">

      <div style="font-family:'Suez One',Georgia,serif;font-weight:400;font-size:42px;line-height:1.06;margin-top:8px;">דנה</div>

        <span style="font-size:16px;font-weight:800;flex:1;min-width:0;display:flex;align-items:center;gap:9px;">
          <span style="flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;color:#2C6BFF;display:grid;place-items:center;font-size:9.5px;font-weight:800;direction:ltr;">DN</span>
          הצפרדעים
        </span>
        <span style="font-size:15px;font-weight:800;background:rgba(255,255,255,.18);padding:5px 11px;border-radius:8px;">שלישית מתוך שלוש</span>
      </div>
    </div>
    <div style="height:9px;background:radial-gradient(circle at 5px 0,transparent 3.6px,#17161C 4.1px) 0 0/10px 10px repeat-x;"></div>
  </div>

  <div style="background:#FFEDE9;border:1px solid #F7CDC3;border-radius:14px;padding:11px 14px 12px;display:flex;align-items:center;gap:12px;">
    <span style="min-width:0;flex:1;display:flex;flex-direction:column;gap:3px;">
      <span style="font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#D8351C;">הסבב הזה</span>
      <span style="font-family:'Suez One',Georgia,serif;font-weight:400;font-size:19px;line-height:1.3;color:#17161C;">פנטומימה</span>
    </span>
    <span style="font-size:12.5px;font-weight:700;color:#8E4231;text-align:end;line-height:1.35;max-width:140px;">היא תמחיז. תצעקו כשקלטתם.</span>
  </div>

  <div style="flex:1;"></div>

  <div style="background:#FFFFFF;border:1px solid #E7E4F0;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:11px;">

    <div style="display:grid;grid-template-columns:26px 1fr auto;align-items:center;column-gap:10px;">
      <span style="width:26px;height:26px;border-radius:50%;background:#12B886;color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:800;direction:ltr;">TM</span>
      <span style="min-width:0;display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:13.5px;font-weight:700;">התמנונים</span>
        <span style="height:8px;border-radius:99px;background:#F1EFF9;position:relative;overflow:hidden;display:block;"><span style="position:absolute;top:0;bottom:0;inset-inline-start:0;width:58%;border-radius:99px;background:#12B886;"></span></span>
      </span>
      <span style="font-size:14px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;">14</span>
    </div>
    <div style="display:grid;grid-template-columns:26px 1fr auto;align-items:center;column-gap:10px;">
      <span style="width:26px;height:26px;border-radius:50%;background:#2C6BFF;color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:800;direction:ltr;">TZ</span>
      <span style="min-width:0;display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:13.5px;font-weight:700;">הצפרדעים</span>
        <span style="height:8px;border-radius:99px;background:#F1EFF9;position:relative;overflow:hidden;display:block;"><span style="position:absolute;top:0;bottom:0;inset-inline-start:0;width:46%;border-radius:99px;background:#2C6BFF;"></span></span>
      </span>
      <span style="font-size:14px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;">11</span>
    </div>
    <div style="display:grid;grid-template-columns:26px 1fr auto;align-items:center;column-gap:10px;">
      <span style="width:26px;height:26px;border-radius:50%;background:#FF5A3D;color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:800;direction:ltr;">NM</span>
      <span style="min-width:0;display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:13.5px;font-weight:700;">הנמלים</span>
        <span style="height:8px;border-radius:99px;background:#F1EFF9;position:relative;overflow:hidden;display:block;"><span style="position:absolute;top:0;bottom:0;inset-inline-start:0;width:38%;border-radius:99px;background:#FF5A3D;"></span></span>
      </span>
      <span style="font-size:14px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;">9</span>
    </div>
  </div>

</div>
