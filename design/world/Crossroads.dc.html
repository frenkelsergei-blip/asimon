<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@800&family=Suez+One&display=swap">
  <style>
:root{
  color-scheme:light;
  --paper:#FFFCF6; --surface:#FFFFFF; --sunk:#F4F2FA; --sunk2:#F1EFF9;
  --ink:#17161C; --second:#46445A; --muted:#6B6A78; --faint:#A3A1B0; --zero:#B4B2C2;
  --rule:#E7E4F0; --hair:#F1EFF9; --on-ink:#FFFFFF;
  --accent:#2C6BFF; --accent-deep:#1B4FD1; --accent-soft:#EAF0FF; --accent-ink:#1B4FD1;
  --good:#12B886;   --good-deep:#0D8F69;   --good-soft:#E6F7F1;   --good-ink:#0D8F69;
  --blind:#FFB020;  --blind-deep:#D18A08;  --blind-soft:#FFF3DB;  --blind-ink:#B77800;
  --guilty:#FF5A3D; --guilty-deep:#D8351C; --guilty-soft:#FFEDE9; --guilty-ink:#D8351C;
  --violet:#7A5AF8; --violet-soft:#EFEAFF; --violet-ink:#5B3FD1;
  /* per-map board palettes — four lane colours each, "classic" matching the
     game's original accent/good/blind/guilty lanes exactly */
  --map-classic-0:var(--accent); --map-classic-1:var(--good); --map-classic-2:var(--blind); --map-classic-3:var(--guilty);
  --map-twist-0:#7A5AF8;  --map-twist-1:#12B886;  --map-twist-2:#DB2777;  --map-twist-3:#D97706;
  --map-storm-0:#0891B2;  --map-storm-1:#4D7C0F;  --map-storm-2:#FF5A3D;  --map-storm-3:#7A5AF8;
  /* The desert kept two greens and two blues — a teal, a cobalt, a cyan and an
     olive, all four inside a third of the colour wheel, so a board of four
     lanes read as a board of two. Green for the oasis and blue for the sky
     stay; the cyan and the olive become a desert rose and a sand gold, which
     puts the four roughly ninety degrees apart and leaves nothing to confuse. */
  --map-sprint-0:#12B886; --map-sprint-1:#2C6BFF; --map-sprint-2:#D92B4B; --map-sprint-3:#D9A404;
  --map-chaos-0:#DB2777;  --map-chaos-1:#D97706;  --map-chaos-2:#7A5AF8;  --map-chaos-3:#FF5A3D;
  /* the ink a lit pill's word is written in, one per lane colour. It used to
     be worked out from the lane number — lane two, the classic board's yellow,
     took dark ink and every other lane took white. That is a fact about a
     colour and not about a lane: on the other four maps lane two is cyan,
     violet, pink or coral, and each of them was being written on in dark
     brown. The colour is declared here, so its ink is declared beside it. */
  --map-classic-0-ink:#FFFFFF; --map-classic-1-ink:#FFFFFF; --map-classic-2-ink:#2A1B00; --map-classic-3-ink:#FFFFFF;
  --map-twist-0-ink:#FFFFFF;   --map-twist-1-ink:#FFFFFF;   --map-twist-2-ink:#FFFFFF;   --map-twist-3-ink:#FFFFFF;
  --map-storm-0-ink:#FFFFFF;   --map-storm-1-ink:#FFFFFF;   --map-storm-2-ink:#FFFFFF;   --map-storm-3-ink:#FFFFFF;
  --map-sprint-0-ink:#FFFFFF;  --map-sprint-1-ink:#FFFFFF;  --map-sprint-2-ink:#FFFFFF;  --map-sprint-3-ink:#2A1B00;
  --map-chaos-0-ink:#FFFFFF;   --map-chaos-1-ink:#FFFFFF;   --map-chaos-2-ink:#FFFFFF;   --map-chaos-3-ink:#FFFFFF;
  --tone:var(--accent); --tone-soft:var(--accent-soft); --tone-ink:var(--accent-ink); --wash:.12;
  --display:"Suez One",Georgia,serif;
  --logo:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(23,22,28,.05), 0 8px 24px -14px rgba(23,22,28,.35);
  /* ---- the four dials the sheet is sized by ----
     --k     how large everything on the sheet is drawn. Every font size and
             every figure below is a multiple of it, so one number moves the
             whole design from a phone in a hand to a tablet on a table.
     --sheet how wide the column may get. --gap and --pad, its breathing.
     --tall  how much height a tall figure may take. It starts out of reach
             so it never wins a min(); only landscape brings it down.
     A phone leaves all of them alone. The tablet block at the foot turns
     them up, and nothing in between needs to know it happened. */
  --k:1; --sheet:430px; --gap:18px; --pad:16px; --tall:9999px;
  --bigface:min(46vw,calc(132px * var(--k)),var(--tall));
}
  body{margin:0;background:#F4F1E7;font-family:Assistant,'Arial Hebrew',Arial,sans-serif}
  a{color:#2C6BFF} a:hover{color:#1B4FD1}
  .board{width:100%;height:100%;display:block}
.board.world{ border-radius:.5em }
.world .spin{ transform-box:fill-box; transform-origin:center; animation:w-spin 9s linear infinite }
.world .drift{ animation:w-drift 11s ease-in-out infinite alternate }
.world .rise{ animation:w-rise 4.2s ease-out infinite }
.world .glow{ animation:w-glow 2.4s ease-in-out infinite }
.world .flow{ stroke-dasharray:5 9; animation:w-flow 1.1s linear infinite }
.world .bob{ animation:w-bob 2.6s ease-in-out infinite }
.world .flash{ animation:w-flash 7s linear infinite }
.world .pulse{ transform-box:fill-box; transform-origin:center; animation:w-pulse 4s ease-in-out infinite }
.world .fly{ animation:w-fly 26s linear infinite alternate }
.world .idle{ animation:w-idle 3.2s ease-in-out infinite }
/* the wildcard's sign: it hovers, and its sparks come and go */
.world .float{ animation:w-float 2.8s ease-in-out infinite }
.world .twinkle{ transform-box:fill-box; transform-origin:center; animation:w-twinkle 2.2s ease-in-out infinite }
.world .spin,.world .drift,.world .rise,.world .glow,.world .flow,.world .bob,.world .flash,
.world .pulse,.world .fly,.world .idle,.world .float,.world .twinkle{ animation-delay:calc(var(--t, 0s) + var(--d, 0s)) }
.world .hop{ animation:w-hop .75s cubic-bezier(.25,.6,.35,1) both; transform-box:fill-box; transform-origin:50% 100% }
.world .hopshadow{ animation:w-hopshadow .75s ease both; transform-box:fill-box; transform-origin:center }
@keyframes w-spin{ to{ transform:rotate(360deg) } }
@keyframes w-drift{ from{ transform:translateX(-16px) } to{ transform:translateX(16px) } }
@keyframes w-rise{ 0%{ transform:translateY(0); opacity:.75 } 100%{ transform:translateY(-46px); opacity:0 } }
@keyframes w-glow{ 0%,100%{ opacity:1 } 50%{ opacity:.62 } }
@keyframes w-flow{ to{ stroke-dashoffset:-14 } }
@keyframes w-bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-4px) } }
@keyframes w-flash{ 0%,86%,100%{ opacity:0 } 88%,90%{ opacity:1 } 89%{ opacity:.2 } }
@keyframes w-pulse{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.12) } }
@keyframes w-fly{ from{ transform:translateX(-40px) } to{ transform:translateX(300px) } }
@keyframes w-idle{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-2px) } }
@keyframes w-float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-3px) } }
@keyframes w-twinkle{ 0%,100%{ opacity:0; transform:scale(.3) rotate(0deg) } 50%{ opacity:1; transform:scale(1) rotate(45deg) } }
@keyframes w-hop{
  0%{ transform:translate(var(--dx), var(--dy)) }
  45%{ transform:translate(calc(var(--dx) * .5), calc(var(--dy) * .5 - 70px)) }
  82%{ transform:translate(0, 0) }
  90%{ transform:translate(0, 3px) scale(1.08, .9) }
  100%{ transform:none } }

  </style>
</helmet>
