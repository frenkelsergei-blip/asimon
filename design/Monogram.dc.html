<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap">
  <style>body{margin:0;background:#FFFCF6}a{color:#2C6BFF}a:hover{color:#1B4FD1}</style>
</helmet>

<div dir="rtl" style="width:390px;height:844px;background:#FFFCF6;font-family:'Assistant',system-ui,sans-serif;color:#17161C;display:flex;flex-direction:column;gap:18px;padding:22px 16px 26px;box-sizing:border-box;background-image:linear-gradient(180deg,rgba(255,176,32,.12),rgba(255,252,246,0));background-repeat:no-repeat;background-size:100% 300px;">

  <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#B77800;">אפשרות ב · אות וצבע</span>

  <div style="display:flex;flex-direction:column;gap:5px;">
    <div style="font-family:'Suez One',Georgia,serif;font-size:34px;line-height:1.05;">בחרו צבע</div>
    <div style="font-size:14.5px;color:#6B6A78;">האות הראשונה של השם, על הצבע שבחרתם.</div>
  </div>

  <div style="display:grid;place-items:center;padding:8px 0 4px;">
    <span style="width:104px;height:104px;border-radius:50%;background:#7A5AF8;display:grid;place-items:center;color:#fff;font-family:'Suez One',Georgia,serif;font-size:42px;">ס</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:9px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6B6A78;display:flex;align-items:center;gap:10px;">צבע<span style="flex:1;height:1px;background:#E7E4F0;"></span></span>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;">
      <span style="aspect-ratio:1;border-radius:16px;background:#2C6BFF;"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:#12B886;"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:#FF5A3D;"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:#D97706;"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:#7A5AF8;box-shadow:0 0 0 3px #FFFCF6,0 0 0 6px #7A5AF8;"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:#0891B2;"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:#DB2777;"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:#4D7C0F;"></span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:9px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6B6A78;display:flex;align-items:center;gap:10px;">רקע<span style="flex:1;height:1px;background:#E7E4F0;"></span></span>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;">
      <span style="aspect-ratio:1;border-radius:16px;background:#7A5AF8;border:2px solid #2C6BFF;box-shadow:0 0 0 3px rgba(44,107,255,.16);"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:#7A5AF8;background-image:radial-gradient(circle at 5px 5px,rgba(255,255,255,.42) 2px,transparent 2.5px);background-size:12px 12px;"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:#7A5AF8;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.32) 0 5px,transparent 5px 12px);"></span>
      <span style="aspect-ratio:1;border-radius:16px;background:linear-gradient(140deg,#7A5AF8 0 50%,#5E3FDB 50% 100%);"></span>
    </div>
  </div>

  <div style="flex:1;"></div>

  <div style="background:#FFFFFF;border:1px solid #E7E4F0;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6B6A78;">איך זה נראה בשולחן</span>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:26px;height:26px;border-radius:50%;background:#7A5AF8;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;">ס</span>
      <span style="width:20px;height:20px;border-radius:50%;background:#7A5AF8;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:800;">ס</span>
      <span style="width:14px;height:14px;border-radius:50%;background:#7A5AF8;"></span>
      <span style="font-size:12.5px;color:#6B6A78;">קריא עד לגודל של חייל על הלוח.</span>
    </div>
  </div>

  <button style="font-family:'Assistant',sans-serif;font-size:16px;font-weight:800;border:0;border-radius:13px;background:#2C6BFF;color:#FFFFFF;padding:16px;width:100%;box-shadow:0 1px 2px rgba(23,22,28,.05),0 8px 24px -14px rgba(23,22,28,.35);">להצטרף למשחק</button>
</div>
</x-dc>
</body>
</html>
