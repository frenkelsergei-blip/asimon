<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Assistant:wght@400;600;700;800&family=Rubik:wght@500;700;800&family=Suez+One&display=swap">
  <style>
    body { margin: 0; font-family: "Assistant", system-ui, sans-serif; background: #FFFCF6; color: #17161C; }
    a { color: #2C6BFF; } a:hover { color: #1B4FD1; }
    .kick { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #6B6A78; margin: 0; }
    .ttl { font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -.015em; }
    .cut { margin: 0; font-size: 13px; line-height: 1.5; color: #6B6A78; text-wrap: pretty; }
    .rub { font-family: "Rubik", system-ui, sans-serif; line-height: 1; }
    .sz { font-family: "Suez One", Georgia, serif; font-weight: 400; line-height: 1; }
    .ab { font-family: "Archivo Black", system-ui, sans-serif; font-weight: 400; line-height: 1; }
    .rtl { direction: rtl; }
    .kick.he { text-transform: none; letter-spacing: .04em; font-size: 11.5px; }
  </style>
</helmet>

<div style="padding: 38px 42px; display: flex; flex-direction: column; gap: 24px; min-height: 560px;">
  <div style="display: flex; flex-direction: column; gap: 5px;">
    <p class="kick">the chosen mark, at the sizes the game actually uses</p>
    <h2 class="ttl">Where it shows up</h2>
  </div>

  <div style="display: flex; gap: 26px; align-items: flex-start;">

    <div style="flex: 0 0 300px; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 300px; height: 400px; border-radius: 20px; background: #FFFCF6; box-shadow: 0 1px 2px rgba(23,22,28,.06), 0 30px 60px -34px rgba(23,22,28,.45); padding: 22px 18px; display: flex; flex-direction: column; gap: 16px; direction: rtl; background-image: linear-gradient(180deg, rgba(255,176,32,.16), rgba(255,176,32,0)); background-repeat: no-repeat; background-size: 100% 190px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <p class="kick he" style="font-size: 10px;">משחק מסיבה</p>
          <svg viewBox="0 0 100 100" style="width: 22px; height: 22px; flex: 0 0 22px;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="43" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 6px;">
          <div class="rub rtl" style="font-weight: 800; font-size: 40px;">א<svg viewBox="0 0 100 100" style="display: inline-block; width: 0.78em; height: 0.78em; vertical-align: -0.05em;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="43" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg>ימון</div>
          <p style="margin: 0; font-size: 14px; color: #6B6A78;">משפט אחד &middot; הזדמנות אחת</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
          <p class="kick he" style="font-size: 10px;">איך קוראים לכם?</p>
          <div style="border: 1px solid #E7E4F0; background: #FFFFFF; border-radius: 13px; padding: 14px 15px; font-size: 16px; font-weight: 700; color: #A3A1B0;">השם שלכם</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 9px; margin-top: auto;">
          <div style="background: #2C6BFF; color: #FFFFFF; border-radius: 13px; padding: 15px; text-align: center; font-size: 15.5px; font-weight: 800; box-shadow: 0 1px 2px rgba(23,22,28,.05), 0 8px 24px -14px rgba(23,22,28,.35);">לפתוח חדר חדש</div>
          <div style="border: 1px solid #E7E4F0; color: #46445A; border-radius: 13px; padding: 13px; text-align: center; font-size: 14.5px; font-weight: 700;">להצטרף עם קוד</div>
        </div>
      </div>
      <p class="cut" style="text-align: center;">the lobby</p>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 18px;">

      <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
        <p class="kick">home screen &amp; tab</p>
        <div style="display: flex; align-items: flex-end; gap: 18px;">
          <div style="width: 96px; height: 96px; flex: 0 0 96px; border-radius: 22px; background: #17161C; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 100 100" style="width: 58px; height: 58px; flex: 0 0 58px;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="47" fill="none" stroke="#17161C" stroke-width="6" stroke-dasharray="3 6.2285" stroke-linecap="butt" opacity=".85"></circle><circle cx="50" cy="50" r="42" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg></div><div style="width: 60px; height: 60px; flex: 0 0 60px; border-radius: 14px; background: #17161C; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 100 100" style="width: 36px; height: 36px; flex: 0 0 36px;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="43" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg></div><div style="width: 38px; height: 38px; flex: 0 0 38px; border-radius: 9px; background: #17161C; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 100 100" style="width: 23px; height: 23px; flex: 0 0 23px;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="43" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg></div>
          <div style="display: flex; align-items: center; gap: 8px; background: #F4F2FA; border-radius: 9px 9px 0 0; padding: 9px 14px 11px; align-self: flex-end;">
            <svg viewBox="0 0 100 100" style="width: 16px; height: 16px; flex: 0 0 16px;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="43" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg><span style="font-size: 12.5px; font-weight: 700; color: #46445A;">אסימון</span>
          </div>
        </div>
      </div>

      <div style="background: #17161C; border-radius: 18px 18px 4px 4px; padding: 22px; display: flex; flex-direction: column; gap: 16px; direction: rtl;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <p class="kick he" style="color: rgba(255,255,255,.7);">קוד החדר</p>
          <svg viewBox="0 0 100 100" style="width: 26px; height: 26px; flex: 0 0 26px;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="43" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg>
        </div>
        <div class="rub" style="font-weight: 800; font-size: 46px; letter-spacing: .18em; color: #FFFFFF; direction: ltr;">RGVK</div>
      </div>
      <div style="height: 9px; margin-top: -14px; background: radial-gradient(circle at 5px 0, transparent 3.6px, #17161C 4.1px) 0 0/10px 10px repeat-x;"></div>

      <div style="display: flex; gap: 14px;">
        <div class="card" style="flex: 1; display: flex; flex-direction: column; gap: 12px; align-items: center;">
          <svg viewBox="0 0 100 100" style="width: 40px; height: 40px; flex: 0 0 40px;"><circle cx="50" cy="50" r="50" fill="#17161C"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#FFFCF6" transform="rotate(-30 50 50)"></rect></svg><p class="kick">one colour</p>
        </div>
        <div class="card" style="flex: 1; display: flex; flex-direction: column; gap: 12px; align-items: center;">
          <div style="display: flex; gap: 10px; align-items: center; height: 40px;"><svg viewBox="0 0 100 100" style="width: 32px; height: 32px; flex: 0 0 32px;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="43" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg><svg viewBox="0 0 100 100" style="width: 20px; height: 20px; flex: 0 0 20px;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="43" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg><svg viewBox="0 0 100 100" style="width: 16px; height: 16px; flex: 0 0 16px;"><circle cx="50" cy="50" r="50" fill="#D18A08"></circle><circle cx="50" cy="50" r="43" fill="#FFB020"></circle><rect x="26" y="41" width="48" height="18" rx="9" fill="#17161C" transform="rotate(-30 50 50)"></rect></svg></div>
          <p class="kick">32 &middot; 20 &middot; 16</p>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
