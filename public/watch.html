<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asimon — three phones</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap">
<style>
  :root{ color-scheme:light }
  *{box-sizing:border-box}
  body{margin:0;background:#EFEAE2;font-family:"Assistant",system-ui,sans-serif;color:#17161C;
    padding:18px 16px 26px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;max-width:1360px;margin:0 auto 14px}
  h1{font-family:"Suez One",Georgia,serif;font-weight:400;font-size:26px;margin:0}
  .hint{font-size:13.5px;color:#6B6A78}
  .rack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
    max-width:1360px;margin:0 auto;align-items:start}
  @media (max-width:1100px){ .rack{grid-template-columns:1fr} }
  .seat{background:#FFFCF6;border-radius:22px;overflow:hidden;
    box-shadow:0 1px 2px rgba(23,22,28,.06),0 30px 60px -40px rgba(23,22,28,.5)}
  .cap{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 15px;background:#17161C;color:#fff}
  .cap b{font-size:14px;font-weight:800}
  .cap span{font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
  iframe{display:block;width:100%;height:812px;border:0;background:#FFFCF6}
  /* the screen is the tablet in the middle of the table: landscape, no seat,
     and it gets its own row under the phones because that is where it sits */
  .telly{max-width:1360px;margin:16px auto 0}
  .telly .seat{overflow:hidden}
  .telly iframe{height:760px;background:#FFFCF6}
</style>
</head>
<body>
<header>
  <h1>Three phones and the screen</h1>
  <span class="hint">Each pane is a separate player with its own saved seat, and the wide one is the
  screen in the middle of the table — it watches by code alone and takes no seat.</span>
</header>
<div class="rack" id="rack"></div>
<div class="telly">
  <div class="seat">
    <div class="cap"><b>The screen</b><span>/board.html &middot; watches, holds no seat</span></div>
    <iframe id="telly" src="/board.html" title="The screen"></iframe>
  </div>
</div>
<script>
  const seats = [
    { p:"1", label:"Phone 1" },
    { p:"2", label:"Phone 2" },
    { p:"3", label:"Phone 3" }
  ];
  document.getElementById("rack").innerHTML = seats.map(s =>
    '<div class="seat"><div class="cap"><b>'+s.label+'</b><span>?p='+s.p+'</span></div>'+
    '<iframe id="f'+s.p+'" src="/?p='+s.p+'" title="'+s.label+'"></iframe></div>').join("");
</script>
</body>
</html>
