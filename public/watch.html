<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asimon — the table</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap">
<style>
  :root{ color-scheme:light; --cols:3; --tall:812px }
  *{box-sizing:border-box}
  body{margin:0;background:#EFEAE2;font-family:"Assistant",system-ui,sans-serif;color:#17161C;
    padding:18px 16px 26px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;max-width:1360px;margin:0 auto 14px}
  h1{font-family:"Suez One",Georgia,serif;font-weight:400;font-size:26px;margin:0}
  .hint{font-size:13.5px;color:#6B6A78}
  .rack{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:16px;
    max-width:1360px;margin:0 auto;align-items:start}
  @media (max-width:1100px){ .rack{grid-template-columns:1fr} }
  .seat{background:#FFFCF6;border-radius:22px;overflow:hidden;
    box-shadow:0 1px 2px rgba(23,22,28,.06),0 30px 60px -40px rgba(23,22,28,.5)}
  .cap{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 15px;background:#17161C;color:#fff}
  .cap b{font-size:14px;font-weight:800}
  .cap span{font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
  iframe{display:block;width:100%;height:var(--tall);border:0;background:#FFFCF6}
  /* the screen is the tablet in the middle of the table: landscape, no seat,
     and it gets its own row under the phones because that is where it sits */
  .telly{max-width:1360px;margin:16px auto 0}
  .telly .seat{overflow:hidden}
  .telly iframe{height:760px;background:#FFFCF6}
</style>
</head>
<body>
<header>
  <h1 id="title">The table</h1>
  <span class="hint" id="hint"></span>
</header>
<div class="rack" id="rack"></div>
<div class="telly" id="telly" hidden>
  <div class="seat">
    <div class="cap"><b>The screen</b><span id="tellycap">/board.html &middot; watches, holds no seat</span></div>
    <iframe id="tellyframe" title="The screen"></iframe>
  </div>
</div>
<script>
  /* How many phones, and whether the screen sits with them, are asked for in
     the address — so one page serves a two-phone check and an eight-phone
     table without being edited:

       /watch.html                       three phones and the screen
       /watch.html?phones=5              five phones and the screen
       /watch.html?phones=2&screen=0     two phones, no screen
       /watch.html?screen=only           the screen on its own
       /watch.html?phones=4&room=QRTZ    the screen opens straight into a room
       /watch.html?phones=6&cols=3&h=740 a rack that fits a shorter window   */
  const q = new URLSearchParams(location.search);
  const num = (k, d, lo, hi) => {
    const v = Number(q.get(k));
    return Number.isFinite(v) && v > 0 ? Math.max(lo, Math.min(hi, Math.round(v))) : d;
  };
  const screenAsk = (q.get("screen") || "").toLowerCase();
  const only = screenAsk === "only";
  const phones = only ? 0 : num("phones", 3, 1, 12);
  const screen = only || !(screenAsk === "0" || screenAsk === "off" || screenAsk === "no");
  const room = (q.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  const cols = num("cols", Math.min(phones || 1, 3), 1, 6);
  const tall = num("h", 812, 320, 1600);

  document.documentElement.style.setProperty("--cols", cols);
  document.documentElement.style.setProperty("--tall", tall + "px");

  const seats = [];
  for(let i = 1; i <= phones; i++) seats.push({ p:String(i), label:"Phone " + i });
  document.getElementById("rack").innerHTML = seats.map(s =>
    '<div class="seat"><div class="cap"><b>' + s.label + '</b><span>?p=' + s.p + '</span></div>' +
    '<iframe id="f' + s.p + '" src="/?p=' + s.p + '" title="' + s.label + '"></iframe></div>').join("");

  if(screen){
    document.getElementById("telly").hidden = false;
    document.getElementById("tellyframe").src = "/board.html" + (room ? "?room=" + room : "");
    if(room) document.getElementById("tellycap").textContent = "/board.html?room=" + room + " · watches, holds no seat";
  }

  const word = n => ["no","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"][n] || String(n);
  document.title = "Asimon — " + (only ? "the screen"
    : word(phones) + " phone" + (phones === 1 ? "" : "s") + (screen ? " and the screen" : ""));
  document.getElementById("title").textContent = only ? "The screen"
    : (word(phones)[0].toUpperCase() + word(phones).slice(1)) + " phone" + (phones === 1 ? "" : "s") +
      (screen ? " and the screen" : "");
  document.getElementById("hint").textContent = only
    ? "The wide one is the screen in the middle of the table — it watches by code alone and takes no seat."
    : "Each pane is a separate player with its own saved seat" +
      (screen ? ", and the wide one is the screen in the middle of the table — it watches by code alone and takes no seat." : ".") +
      " Ask for more with ?phones=" + Math.min(phones + 1, 12) + (screen ? ", drop the screen with &screen=0." : ".");
</script>
</body>
</html>
